<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    LiveDub Voice app icon drawn for 16 px (system tray and title bar at 100 %). Five 2 px bars
    with 1 px gaps: two teal, the sun bar, two coral. Regenerate the icons with `pnpm icons`.
  -->
  <rect width="16" height="16" rx="3.5" fill="#12263A"/>
  <g fill="#2EC4B6">
    <rect x="1" y="6" width="2" height="4" rx="1"/>
    <rect x="4" y="4" width="2" height="8" rx="1"/>
  </g>
  <rect x="7" y="2" width="2" height="12" rx="1" fill="#FFC857"/>
  <g fill="#FF7A59">
    <rect x="10" y="4" width="2" height="8" rx="1"/>
    <rect x="13" y="6" width="2" height="4" rx="1"/>
  </g>
</svg>
