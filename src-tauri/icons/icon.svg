<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    LiveDub Voice app icon, master for 64 px and up (PNGs, ICNS, the large entries of icon.ico,
    the installer sidebar) and for the README and the website. The 16, 20, 24, 32 and 48 px
    entries of icon.ico come from the pixel-hinted icon-<size>.svg files next to this one.
    Regenerate every icon with `pnpm icons`.

    Two-tone voice wave: one voice that changes color as it gets translated. The four teal bars
    are the others (incoming, others → you), the four coral ones are you (outgoing, you → others)
    and the wider sun bar in the middle is the moment of translation. Colors are the Ruta
    dark-theme accents; the navy tile is the Ruta dark surface (src/styles/tokens.css), which
    keeps the bars readable on light and dark taskbars.

    Geometry: bars 72 wide (the sun bar 88) with 24 gaps, centered on x = 512 and y = 512;
    heights 192, 320, 512, 640, 768 from the outside in. Edges land on whole pixels at 256 px.
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#12263A"/>
  <g fill="#2EC4B6">
    <rect x="84" y="416" width="72" height="192" rx="36"/>
    <rect x="180" y="352" width="72" height="320" rx="36"/>
    <rect x="276" y="256" width="72" height="512" rx="36"/>
    <rect x="372" y="192" width="72" height="640" rx="36"/>
  </g>
  <rect x="468" y="128" width="88" height="768" rx="44" fill="#FFC857"/>
  <g fill="#FF7A59">
    <rect x="580" y="192" width="72" height="640" rx="36"/>
    <rect x="676" y="256" width="72" height="512" rx="36"/>
    <rect x="772" y="352" width="72" height="320" rx="36"/>
    <rect x="868" y="416" width="72" height="192" rx="36"/>
  </g>
</svg>
